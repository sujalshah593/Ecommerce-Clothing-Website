services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD for production Redis}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD for production Redis}
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD for production Redis}@redis:6379
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    networks:
      - app-network

  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD for production Redis}@redis:6379
    command: ["node", "worker.js"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/workerHealthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    networks:
      - app-network

  frontend:
    build:
      context: ./Frontend/my-app
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL for the production frontend}
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
